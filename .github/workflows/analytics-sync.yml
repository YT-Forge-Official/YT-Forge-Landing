# Hourly heartbeat for /stats. Vercel's Hobby plan only allows daily crons,
# and the download chart's hourly resolution comes from taking a snapshot
# every hour, so the schedule lives here instead. vercel.json keeps a daily
# cron as a backstop in case this one is delayed or paused.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SYNC_URL     https://yt-forge.com/api/cron/sync
#   CRON_SECRET  the same value as the Vercel env var
#
# A missed or late run loses nothing: the next snapshot picks up every
# download since the last one, the dashboard just spreads it across the gap.

name: Analytics sync

on:
  schedule:
    - cron: '7 * * * *' # minute 7, off the top of the hour when GitHub's queue is busiest
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger sync
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SYNC_URL }}?trigger=github-actions"
